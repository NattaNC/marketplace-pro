name: Verify skill and scripts
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax and tests
        run: |
          python -m json.tool plugin.json >/dev/null
          python -m unittest discover -s tests -v
          python scripts/quality_check.py examples/anuncio_exemplo.json --json
